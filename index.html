<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Priyanshu Hill Drive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MAIN MENU -->

    <div id="menu">

        <div class="menu-card">

            <div class="game-icon">🚗</div>

            <h1>PRIYANSHU</h1>

            <h2>HILL DRIVE</h2>

            <p class="developer">
                Developed by
                <strong>Priyanshu Mishra</strong>
            </p>

            <!-- BEST SCORE -->

            <div class="best-box">

                🏆 Best Distance:
                <span id="menuBestScore">0</span> m

            </div>

            <!-- COINS -->

            <div class="menu-coins">

                🪙 Coins:
                <strong id="menuCoins">0</strong>

            </div>

            <!-- VEHICLE SELECT -->

            <div class="vehicle-title">
                SELECT VEHICLE
            </div>

            <div id="vehicleSelection">

                <button
                    class="vehicle-card selected"
                    data-vehicle="car">

                    <div class="vehicle-emoji">
                        🚗
                    </div>

                    <strong>RED RACER</strong>

                    <small>
                        Balanced
                    </small>

                    <span class="vehicle-status">
                        SELECTED
                    </span>

                </button>


                <button
                    class="vehicle-card locked"
                    data-vehicle="suv">

                    <div class="vehicle-emoji">
                        🚙
                    </div>

                    <strong>BLUE SUV</strong>

                    <small>
                        High Power
                    </small>

                    <span class="vehicle-status">
                        🔒 50 COINS
                    </span>

                </button>


                <button
                    class="vehicle-card locked"
                    data-vehicle="bike">

                    <div class="vehicle-emoji">
                        🏍️
                    </div>

                    <strong>HILL BIKE</strong>

                    <small>
                        Super Fast
                    </small>

                    <span class="vehicle-status">
                        🔒 100 COINS
                    </span>

                </button>

            </div>

            <!-- START -->

            <button id="startBtn">
                ▶ START GAME
            </button>

            <p class="instruction">

                ⌨️ Arrow Keys / D = Accelerate
                <br>

                ⬅️ Arrow Left / A = Brake
                <br>

                📱 Mobile buttons supported

            </p>

        </div>

    </div>


    <!-- GAME CANVAS -->

    <canvas id="gameCanvas"></canvas>


    <!-- HUD -->

    <div id="hud">

        <div class="hud-item">
            📏
            <span id="distance">0</span> m
        </div>

        <div class="hud-item">
            🪙
            <span id="coins">0</span>
        </div>

        <div class="hud-item">
            ⛽
            <span id="fuel">100</span>%
        </div>

    </div>


    <!-- MOBILE CONTROLS -->

    <div id="controls">

        <button
            id="brakeBtn"
            class="control brake">

            ◀ BRAKE

        </button>


        <button
            id="gasBtn"
            class="control gas">

            GAS ▶

        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
