<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priyanshu Hill Drive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="menu">
    <h1>PRIYANSHU HILL DRIVE</h1>
    <p>Developer: Priyanshu Mishra</p>
    <button id="startBtn">Start Game</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <span>Distance: <b id="distance">0</b> m</span>
    <span>Coins: <b id="coins">0</b></span>
    <span>Fuel: <b id="fuel">100</b>%</span>
  </div>

  <div id="controls">
    <button id="brake">Brake</button>
    <button id="gas">Gas</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
