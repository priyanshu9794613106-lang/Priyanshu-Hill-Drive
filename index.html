<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Priyanshu Hill Drive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- MENU -->

    <div id="menu">

        <div class="menu-card">

            <div class="game-icon">🚗</div>

            <h1>PRIYANSHU</h1>

            <h2>HILL DRIVE</h2>

            <p class="developer">
                Developed by
                <strong>Priyanshu Mishra</strong>
            </p>

            <div class="best-box">
                🏆 Best Distance:
                <span id="menuBestScore">0</span> m
            </div>

            <div class="menu-coins">
                🪙 Coins:
                <strong id="menuCoins">0</strong>
            </div>

            <div class="vehicle-title">
                SELECT VEHICLE
            </div>

            <div id="vehicleSelection">

                <button
                    class="vehicle-card selected"
                    data-vehicle="car">

                    <div class="vehicle-emoji">🚗</div>

                    <strong>RED RACER</strong>

                    <small>Balanced</small>

                    <span class="vehicle-status">
                        SELECTED
                    </span>

                </button>


                <button
                    class="vehicle-card locked"
                    data-vehicle="suv">

                    <div class="vehicle-emoji">🚙</div>

                    <strong>BLUE SUV</strong>

                    <small>High Power</small>

                    <span class="vehicle-status">
                        🔒 50 COINS
                    </span>

                </button>


                <button
                    class="vehicle-card locked"
                    data-vehicle="bike">

                    <div class="vehicle-emoji">🏍️</div>

                    <strong>HILL BIKE</strong>

                    <small>Super Fast</small>

                    <span class="vehicle-status">
                        🔒 100 COINS
                    </span>

                </button>

            </div>

            <button id="startBtn">
                ▶ START GAME
            </button>

            <p class="instruction">
                ⌨️ Arrow Keys / D = GAS
                <br>
                ⬅️ Arrow Left / A = BRAKE
                <br>
                📱 Mobile controls supported
            </p>

        </div>

    </div>


    <!-- GAME -->

    <canvas id="gameCanvas"></canvas>


    <!-- COUNTDOWN -->

    <div id="countdown">
        3
    </div>


    <!-- HUD -->

    <div id="hud">

        <div class="hud-item">
            📏
            <span id="distance">0</span> m
        </div>

        <div class="hud-item">
            🪙
            <span id="coins">0</span>
        </div>

        <div class="hud-item">
            ⛽
            <span id="fuel">100</span>%
        </div>

        <button
            id="pauseBtn"
            class="hud-button">

            ⏸️

        </button>

        <button
            id="soundBtn"
            class="hud-button">

            🔊

        </button>

    </div>


    <!-- PAUSE -->

    <div id="pauseScreen">

        <div class="pause-card">

            <div class="pause-icon">
                ⏸️
            </div>

            <h2>GAME PAUSED</h2>

            <button id="resumeBtn">
                ▶ RESUME
            </button>

            <button id="quitBtn">
                🏠 MAIN MENU
            </button>

        </div>

    </div>


    <!-- CONTROLS -->

    <div id="controls">

        <button
            id="brakeBtn"
            class="control brake">

            ◀ BRAKE

        </button>

        <button
            id="gasBtn"
            class="control gas">

            GAS ▶

        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
